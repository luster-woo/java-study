spring.application.name=jwt-practice

# JSP view 위치 : src/main/webapp/WEB-INF/views/{name}.jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# H2 메모리 DB (설정이 없으면 Boot가 jdbc:h2:mem:... 으로 자동 구성, 테이블은 create-drop)
spring.jpa.open-in-view=false

# ===================== JWT 설정 =====================
# access token 만료 시간(분): 일반적으로 1h~24h, 높은 보안이 필요하면 5m~1h
#   실습에서는 만료를 바로 확인하려고 1분
ssafy.jwt.access-expmin=1
# refresh token 만료 시간(분): 일반적으로 1일~몇 달 / 실습은 2분
ssafy.jwt.refresh-expmin=2
# 임의의 문자열로 키 생성 (HS256은 32바이트 이상 필요, 짧으면 WeakKeyException)
ssafy.jwt.secret-string=your-very-long-and-secure-random-secret-key-here-12345678

# 토큰 흐름 로그 보기
logging.level.com.ssafy.security=DEBUG
# logging.level.org.springframework.security=TRACE
