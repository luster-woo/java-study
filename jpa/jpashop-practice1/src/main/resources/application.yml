spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/jpashop1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
#        show_sql: true
        format_sql: true

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.orm.jdbc.bind: trace

# 2장 테이블·컬럼명 생성 전략 (스프링 부트 기본값이라 안 적어도 똑같이 동작)
#   카멜 케이스 → 언더스코어, .(점) → _, 대문자 → 소문자
#   1. 논리명(implicit): 컬럼·테이블명을 명시하지 않았을 때 적용
#   2. 물리명(physical): 모든 논리명에 적용 → 회사 룰(username → usernm)로 바꿀 때 사용
# PDF의 SpringPhysicalNamingStrategy는 Boot 2 클래스라 Boot 3에선 없음 → 아래가 Boot 3 기본값
