spring.application.name=spring-ai-practice

# ===================== TODO: 01-2 서비스 키 =====================
# 키는 secret.properties에 적는다 (.gitignore 처리 → git에 안 올라감)
spring.config.import=optional:classpath:secret.properties

## OpenAI 설정 - 자동 설정 사용 (GMS 경유)
spring.ai.openai.api-key=${ssafy.gms.api-key}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/
spring.ai.openai.chat.completions-path=chat/completions
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/
spring.ai.openai.embedding.options.model=text-embedding-3-large

## Google Gemini 설정 - 수동 설정 사용 (config/ChatModelConfig에서 @Value로 읽음)
spring.ai.google.genai.api-key=${ssafy.gms.api-key}
spring.ai.google.genai.base-url=https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
# ===================== END: 01-2 =====================

# ChatClient.Builder는 config/ChatClientConfig에서 모델별로 직접 만든다
# (ChatModel이 2개라 자동 구성 Builder는 어느 모델을 쓸지 정할 수 없음)
spring.ai.chat.client.enabled=false

# ===================== TODO: 08 Redis =====================
ssafy.redis.host=localhost
ssafy.redis.port=6379
# ===================== END: 08 =====================

# ===================== TODO: 10 JDBC ChatMemoryRepository =====================
# table이 없을 때 초기화 여부: 개발 중엔 always, 운영에선 never
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:scripts/chatmemoryrepo-mysql.sql

# docker-compose의 mysql (로컬 MySQL을 쓰면 계정만 바꾸면 됨, DB는 없으면 자동 생성)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafylive?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=ssafy
# ===================== END: 10 =====================

# 업로드 이미지 (GMS는 100KB 미만만 지원)
spring.servlet.multipart.max-file-size=5MB

# SimpleLoggerAdvisor는 DEBUG로 찍음 → 레벨을 내려야 보임
logging.level.org.springframework.ai.chat.client.advisor=debug
logging.level.com.ssafy.ai=debug
