spring.application.name=FW_06_REST

# log.debug 출력
logging.level.com.ssafy=DEBUG

# Swagger (기본 경로: /swagger-ui.html, JSON 명세: /v3/api-docs)
# 메서드 순서를 HTTP 메서드 기준으로 정렬
springdoc.swagger-ui.operations-sorter=method
# 운영 서버에서는 보통 끔
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

# ===== [04] RestClient =====
# vworld 인증키: https://www.vworld.kr 에서 발급 → 여기에 붙여넣기 (GitHub 에 올리지 않도록 주의!)
key.vworld=

# ===== [05, 06] 트랜잭션 실습 =====
# DB 설정이 없으면 Boot 가 H2 메모리 DB 를 자동으로 만들고 resources/schema.sql 을 실행함
# 트랜잭션 시작 / commit / rollback 로그를 콘솔에 출력
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=DEBUG
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG
